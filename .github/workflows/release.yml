name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git rev-list --count` yields the true commit count
          # used for the board's auto-incrementing display version.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Compute version
        run: |
          echo "VERSION=$(date +'%Y.%m.%d')-$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_ENV"
          # Board display version: "v" + commit count, auto-incrementing per release.
          echo "BOARD_VERSION=v$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Build Pi binary
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags="-s -w -X tfi-display/display.Version=${BOARD_VERSION}" -o build/tfi-display-linux-arm64 .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: build/tfi-display-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
