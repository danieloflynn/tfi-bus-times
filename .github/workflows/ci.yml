name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test with race detector
        run: go test -race ./...
      - name: Benchmarks (informational, non-gating)
        run: go test -bench . -benchmem -run '^$' ./... || true
